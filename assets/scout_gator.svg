<svg xmlns="http://www.w3.org/2000/svg" width="296" height="148" viewBox="4 22 148 74">
  <!-- tail -->
  <path d="M30 70 C14 70 6 60 10 50 C12 46 17 47 16 52 C15 58 22 62 32 61 Z" fill="#5FA864" stroke="#1F4D26" stroke-width="2" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="58" cy="66" rx="32" ry="20" fill="#5FA864" stroke="#1F4D26" stroke-width="2"/>
  <!-- belly -->
  <path d="M34 74 Q58 90 84 74 Q60 82 34 74 Z" fill="#CFE8C4" stroke="#1F4D26" stroke-width="1.2"/>
  <!-- back bumps -->
  <g fill="#3F8547" stroke="#1F4D26" stroke-width="1.2">
    <circle cx="40" cy="50" r="3.2"/><circle cx="50" cy="47" r="3.4"/><circle cx="61" cy="46.5" r="3.4"/><circle cx="72" cy="48.5" r="3.2"/>
  </g>
  <!-- back legs -->
  <path d="M40 82 q-2 9 -9 9 h10 q3 0 3 -6" fill="#5FA864" stroke="#1F4D26" stroke-width="2" stroke-linejoin="round"/>
  <path d="M70 83 q-1 8 -7 8 h10 q3 0 2 -7" fill="#5FA864" stroke="#1F4D26" stroke-width="2" stroke-linejoin="round"/>
  <!-- head and long snout -->
  <path d="M80 52 C86 40 104 38 110 46 L138 50 C146 51 148 58 142 61 L110 66 C98 70 84 68 80 60 Z"
        fill="#5FA864" stroke="#1F4D26" stroke-width="2" stroke-linejoin="round"/>
  <!-- smile and teeth -->
  <path d="M104 61 Q122 62 140 57" fill="none" stroke="#1F4D26" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#1F4D26" stroke-width=".8">
    <path d="M112 61.6 l2 3 l2 -3.2 Z"/><path d="M122 61 l2 3 l2 -3.4 Z"/><path d="M131 59.4 l2 3 l2 -3.6 Z"/>
  </g>
  <!-- nostrils -->
  <circle cx="141" cy="52" r="1.3" fill="#1F4D26"/><circle cx="137" cy="51.2" r="1.1" fill="#1F4D26"/>
  <!-- cheek -->
  <ellipse cx="100" cy="60" rx="3.6" ry="2.2" fill="#F2A7B3" opacity=".8"/>
  <!-- eye bump -->
  <circle cx="96" cy="42" r="8" fill="#5FA864" stroke="#1F4D26" stroke-width="2"/>
  <!-- front arm holding the magnifying glass -->
  <path d="M84 70 q8 4 14 -2" fill="none" stroke="#1F4D26" stroke-width="5" stroke-linecap="round"/>
  <path d="M84 70 q8 4 14 -2" fill="none" stroke="#5FA864" stroke-width="3" stroke-linecap="round"/>
  <!-- magnifying glass handle -->
  <line x1="99" y1="67" x2="106" y2="53" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
  <line x1="99" y1="67" x2="106" y2="53" stroke="#A6192E" stroke-width="3" stroke-linecap="round"/>
  <!-- lens over the eye: the eye looks big through the glass -->
  <circle cx="98" cy="39" r="13" fill="#EAF6FB" fill-opacity=".85" stroke="#121212" stroke-width="3"/>
  <circle cx="98" cy="39" r="7.5" fill="#FFFFFF" stroke="#1F4D26" stroke-width="1.4"/>
  <circle cx="99.5" cy="40" r="4.4" fill="#121212"/>
  <circle cx="101.2" cy="38.2" r="1.5" fill="#FFFFFF"/>
  <path d="M89 33 a12 12 0 0 1 6 -5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
